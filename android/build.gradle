buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // Native BLE and LAN bearers declare API 29 because that is their tested Android platform floor.
        // Keep the app at the same floor rather than forcing a manifest override that can install and then
        // fail when a transport touches an unavailable system API.
        minSdkVersion = 29
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// The Hop SDK and its native BLE/LAN bearer AARs come from one vendored development Maven archive,
// built from Hop commit 8c2a574. Provenance and the revert plan live in
// vendor/README-android-artifact.md.
//
// @hop-mesh/react-native reads this ext property first (before HOP_MAVEN_REPOSITORY and before its
// own module-relative default), so setting it here is the whole wiring.
ext.hopMavenRepository = file("$rootDir/../vendor/hop-android-maven/maven-repository").absolutePath


// Declaring the repository on the ext property alone is NOT enough, and the way it fails is worth
// recording: @hop-mesh/react-native declares this repository inside its OWN repositories block, but
// gradle resolves a project dependency's transitives using the CONSUMING project's repositories. Every
// project therefore gets the repository, scoped to the Hop SDK and its bearer group only.
allprojects {
    repositories {
        maven {
            url = uri(rootProject.ext.hopMavenRepository)
            content {
                includeGroup "sh.hop"
                includeGroup "sh.hop.bearers"
            }
        }
    }
}
// The repository is expanded from ONE committed archive and the expansion is gitignored, so a fresh
// clone has the zip and not the tree. The dependency graph needs the SDK plus BLE and LAN AARs. Without
// this check Gradle fails deep in resolution, without naming the missing prerequisite or its fix.
gradle.projectsEvaluated {
    def mavenRoot = file(ext.hopMavenRepository)
    def required = [
        "sh/hop/hop/0.0.5/hop-0.0.5.aar",
        "sh/hop/bearers/bearer-ble/0.0.2/bearer-ble-0.0.2.aar",
        "sh/hop/bearers/bearer-lan/0.0.2/bearer-lan-0.0.2.aar",
    ].collect { new File(mavenRoot, it) }
    def missing = required.findAll { !it.isFile() }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "The vendored Hop Android repository is not expanded with the SDK and BLE/LAN bearers.\n" +
            "Missing:\n  " + missing.join("\n  ") + "\n" +
            "Run this once from the repo root:\n" +
            "  bash scripts/fetch-android-hop-maven.sh\n" +
            "It verifies the archive sha256 in vendor/README-android-artifact.md before expanding it."
        )
    }
}

apply plugin: "com.facebook.react.rootproject"
