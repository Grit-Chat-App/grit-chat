apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    // Debug stays on React Native's normal Metro path. Proof is release-like and therefore bundles
    // JavaScript, so a physical handset can launch it without Metro.
    debuggableVariants = ["debug", "debugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Where the app's own TTFs are staged for packaging. Resolved to a File here so both the Android
// SourceSet API and the Copy task below name the same directory.
def gritFontAssetsDir = layout.buildDirectory.dir("generated/gritFontAssets").get().asFile

/**
 * The commit this build came from, short form, with a "-dirty" marker when the tree has uncommitted
 * changes: a build made from a modified tree is NOT the commit it names, and saying so is the whole
 * point of baking it in. Returns "unknown" when git cannot answer, which is honest and keeps a
 * source tarball or a CI checkout without history building.
 */
def gritBuildSha() {
    try {
        def sha = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            workingDir rootProject.projectDir
        }.standardOutput.asText.get().trim()
        if (sha.isEmpty()) {
            return 'unknown'
        }
        def dirty = providers.exec {
            commandLine 'git', 'status', '--porcelain'
            workingDir rootProject.projectDir
        }.standardOutput.asText.get().trim()
        return dirty.isEmpty() ? sha : "${sha}-dirty"
    } catch (Exception ignored) {
        return 'unknown'
    }
}

/** Build time in UTC, ISO 8601 to the minute. Precise enough to order builds, no false precision. */
def gritBuildTime() {
    return new Date().format("yyyy-MM-dd'T'HH:mm'Z'", TimeZone.getTimeZone('UTC'))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // One identity across both platforms. This used to be com.burnchat here and com.jwaldrip.gritchat
    // on iOS, which meant the two stores held what looked like two different products.
    //
    // The string is the reverse DNS form of grit.chat, which Jason does own: the purchase completed
    // 2026-08-25T00:16:37Z (registrar transfer to GoDaddy, RDAP). But it is NOT a subdomain of
    // grit.chat. chat.grit.app is a host under grit.app, a different registration held by a third
    // party since 2021-07-23 (DomainCostClub, parked on park1-4.dns.ws). Neither store verifies a
    // bundle id against domain control, so this id is fine as an opaque identifier. Universal Links
    // and App Links are the part that needs a domain we control, and that domain is grit.chat, not
    // grit.app. See PATH.md; the id-versus-deep-link question is open on this pull request.
    namespace "chat.grit.app"
    defaultConfig {
        applicationId "chat.grit.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Detox drives the app through an instrumentation test, so the androidTest variant needs a
        // runner. AndroidJUnitRunner is the one Detox's own DetoxTest entry point expects.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Which Hop relay this build talks to, passed in as -PgritRelayUrl=... and read back by
        // GritConfigModule. The Android counterpart of the GRIT_RELAY_URL build setting that iOS
        // substitutes into Info.plist.
        //
        // The default is the empty string, never a host: an unconfigured build has to reach
        // JavaScript as empty so the app can say the relay is unset instead of dialling somewhere
        // nobody chose. The value is a Java source fragment, hence the escaped quotes; without them
        // the generated BuildConfig would try to compile the URL as an identifier.
        //
        //   emulator: -PgritRelayUrl=ws://10.0.2.2:18765/
        //   phone:    -PgritRelayUrl=ws://<this Mac's LAN address>:18765/
        buildConfigField "String", "GRIT_RELAY_URL", "\"${project.findProperty('gritRelayUrl') ?: ''}\""

        // Which commit this APK came from, and when it was built. Android can work the sha out for
        // itself rather than being told, so it does: no build command has to remember to pass it.
        // versionName is 1.0 and versionCode is 1 forever, so without these every APK is
        // indistinguishable from every other and answering "which build is this" costs a forensic
        // session. A tree with no git available reports "unknown" rather than inventing a value.
        buildConfigField "String", "GRIT_BUILD_SHA", "\"${gritBuildSha()}\""
        buildConfigField "String", "GRIT_BUILD_TIME", "\"${gritBuildTime()}\""
    }
    buildFeatures {
        // Off by default since AGP 8. GRIT_RELAY_URL above needs the generated BuildConfig class.
        buildConfig true
    }
    // Instrumentation follows the standalone proof build unless a caller names another build type.
    testBuildType System.getProperty('testBuildType', 'proof')
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        proof {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // FONTS. On iOS the nine TTFs are copied into the bundle by a Copy Bundle Resources phase and
    // resolved by PostScript name; Android resolves a fontFamily by the FILE name under
    // assets/fonts, and nothing copies them there by default. Without this the app renders in the
    // system face and looks nothing like the design: measured on the first emulator run, the
    // wordmark came up in Roboto instead of Barlow Condensed and the mono relay detail line was
    // proportional.
    //
    // Copied at build time from src/design/fonts, which stays the single source of truth for both
    // platforms. No committed second copy of a binary asset.
    sourceSets {
        main {
            // A resolved File, not a Provider: the Android SourceSet API rejects Providers outright
            // ("You cannot add Provider instances to the Android SourceSet API") because Studio
            // cannot tell generated from static sources through one.
            assets.srcDir(gritFontAssetsDir)
        }
    }
}

tasks.register('copyGritFonts', Copy) {
    from("$rootDir/../src/design/fonts") { include "*.ttf" }
    into new File(gritFontAssetsDir, "fonts")
}

// Every variant's asset merge depends on the copy, so a clean build cannot race it and produce an
// APK with no fonts in it.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach {
    dependsOn 'copyGritFonts'
}
// Lint reads each variant's merged asset sources. The report-model and analysis task names differ,
// so every lint task explicitly depends on the generated font assets under Gradle 9.
tasks.matching { it.name ==~ /(?i).*lint.*/ }.configureEach {
    dependsOn 'copyGritFonts'
}

// The Font Awesome face the design system draws every icon with. react-native-vector-icons ships
// this gradle script for exactly this purpose and it is what the iOS side gets for free from the
// pod's own resource copy. Without it every icon renders as a tofu box, which is how the first
// emulator run looked: the header QR glyph, the relay pill, and all three empty-state buttons.
//
// Scoped to the one font the app actually uses rather than all of them, matching the single entry
// in the iOS UIAppFonts list.
project.ext.vectoricons = [iconFontNames: ['FontAwesome.ttf']]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

repositories {
    // Detox does not publish its Android artifact anywhere fetchable: the npm package carries a
    // small local Maven repo holding exactly the version that npm installed (com.wix:detox and
    // com.wix:detox-legacy). Scoped to com.wix so nothing else pays for a lookup against a
    // single-artifact file repo.
    maven {
        url = uri("$rootDir/../node_modules/detox/Detox-android")
        content {
            includeGroup "com.wix"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Detox, pinned to the version node_modules/detox actually installed rather than the floating
    // '+' the Detox docs suggest. The bundled Maven repo above holds one version, but com.wix:detox
    // is published to Maven Central too, and '+' resolves to the newest across every repository:
    // that is how the native side drifts ahead of the JavaScript runner that drives it.
    //
    // Read from package.json rather than typed here, because a hand-typed pin already went stale
    // once: the suite was wired at 20.28.0, whose ReactNativeLoadingMonitor calls
    // getReactNativeHost(), and RN 0.87's New Architecture throws
    // "You should not use ReactNativeHost directly in the New Architecture" on that call, so every
    // scenario died at launch. The npm upgrade is now the single place a version changes.
    androidTestImplementation "com.wix:detox:${new groovy.json.JsonSlurper().parse(file("$rootDir/../node_modules/detox/package.json")).version}"

    // Declared explicitly rather than leaned on as transitives of the Detox AAR, because the
    // androidTest source set compiles against them. rules and JUnit 4 are the versions Detox's own
    // pom already pins, so they move nothing; runner sits one patch ahead of what rules 1.6.1 asks
    // for, and supplies the AndroidJUnitRunner named in defaultConfig above.
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "junit:junit:4.13.2"
}
