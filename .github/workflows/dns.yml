# Terraform for the grit.chat DNS zone.
#
# Three gates stand between this file and a live DNS change, and they exist for
# three different reasons. Read them before editing, because removing any one of
# them changes what merging a pull request does.
#
# GATE 1, the trigger. `apply` never runs on `pull_request`. A pull request from
# a fork runs with a read only token in this repository's context, and a job that
# could reach a real credential from a branch anyone can push is a supply chain
# hole rather than a convenience. `static` is the only job a pull request runs,
# and it needs no credential at all.
#
# GATE 2, the credential. Every authenticated job carries
# `if: vars.TF_WIF_PROVIDER != ''`. With no variable set the job SKIPS rather
# than failing red. That matters because of a defect this repository already hit
# once: a deploy job that fails on a settings prerequisite parks a red check on
# `main` that every later pull request displays, for a reason that is not a code
# defect. Skipping is honest here in a way that swallowing a real failure would
# not be, because the skip means "no credential exists" rather than "the apply
# worked".
#
# GATE 3, the arming switch. `apply` additionally requires
# `vars.GRIT_DNS_APPLY_ENABLED == 'true'`. Gate 2 alone is not enough: the moment
# a credential is added for any reason, a push to `main` would create a real
# managed zone. This zone should come into existence when someone decides it
# should, not as a side effect of wiring up a credential or of merging a branch.
# So arming it is a deliberate second act.
#
# Consequence worth stating plainly: with no repository variables set, merging a
# pull request that touches this stack creates nothing, changes nothing, and
# leaves no red check. That is the intended state at the time this was written.
name: DNS

on:
  push:
    branches: [main]
    paths:
      - "deploy/terraform/dns/**"
      - ".github/workflows/dns.yml"
  pull_request:
    paths:
      - "deploy/terraform/dns/**"
      - ".github/workflows/dns.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply rather than plan. Requires GRIT_DNS_APPLY_ENABLED to be true."
        type: boolean
        default: false

# Serialised on purpose, and NOT cancel-in-progress. Cancelling an apply half
# way through leaves the GCS state lock held and the next run failing on lock
# acquisition, which is a worse state than waiting.
concurrency:
  group: dns-terraform
  cancel-in-progress: false

permissions:
  contents: read
  # Required for Workload Identity Federation. This is an OIDC token for Google
  # to verify, not a stored key: no service account JSON exists anywhere in this
  # repository or its secrets.
  id-token: write

env:
  TF_VERSION: 1.15.8
  TF_WORKING_DIR: deploy/terraform/dns

jobs:
  # Runs everywhere including pull requests, because it needs no credential.
  # `-backend=false` means init touches no state and contacts no backend, so
  # this cannot race an apply or leak anything.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive ${{ env.TF_WORKING_DIR }}

      - name: Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    needs: static
    runs-on: ubuntu-latest
    # Gate 1 and gate 2. The event check is redundant with the `on:` block for
    # `push`, and it is kept because it is the line someone reads when they add a
    # trigger later.
    if: github.event_name != 'pull_request' && vars.TF_WIF_PROVIDER != ''
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -no-color

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # All three gates. `apply` on a dispatch requires the input as well, so a
    # dispatch defaults to plan only.
    if: >-
      github.event_name != 'pull_request' &&
      vars.TF_WIF_PROVIDER != '' &&
      vars.GRIT_DNS_APPLY_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.apply)
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve -no-color

      # The nameservers cannot be known before the zone exists, so this is the
      # first moment they are readable. Printed rather than committed anywhere,
      # because a nameserver set written into a file is a value that outlives the
      # zone it describes.
      #
      # `delegation_ready` is printed alongside them, and loudly, because reading
      # the nameservers is exactly the moment someone is tempted to paste them
      # into a registrar.
      - name: Report delegation state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ready="$(terraform output -raw delegation_ready)"
          {
            echo "## grit.chat zone"
            echo
            echo "Assigned nameservers:"
            echo '```'
            terraform output -json name_servers | jq -r '.[]'
            echo '```'
            echo
            echo "MX: \`$(terraform output -json mx_rrdatas | jq -r 'join(", ")')\`"
            echo
            echo "SPF: \`$(terraform output -raw spf_record)\`"
            echo
            echo "DMARC: \`$(terraform output -raw dmarc_record)\`"
            echo
            echo "DNSSEC: \`$(terraform output -raw dnssec_state)\`"
            echo
            signing="$(terraform output -raw mail_signing_ready)"
            if [ "$ready" = "true" ]; then
              echo "**Delegation ready.** Web records and inbound mail are both present."
              echo "Changing nameservers at the registrar is safe."
            else
              echo "**DO NOT DELEGATE YET.** delegation_ready is false."
              echo
              echo "- web_ready: \`$(terraform output -raw web_ready)\`"
              echo "- mail_inbound_ready: \`$(terraform output -raw mail_inbound_ready)\`"
              echo
              echo "Delegating in this state points the domain at a zone that"
              echo "cannot serve it. Fill the missing values first."
            fi
            echo
            if [ "$signing" = "false" ]; then
              echo "Outbound mail is UNSIGNED: no DKIM selector is published."
              echo "That is expected before the domain exists in the mail tenant and it"
              echo "does not block delegation. DMARC still passes on the SPF leg alone."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
