# Static Astro site verification and Firebase Hosting publication.
#
# The site is a directory of audited files, not an App Hosting application. The
# deploy job uses Firebase CLI with WIF-generated Application Default Credentials;
# no Firebase token or service-account key belongs in the repository or its
# secrets.
#
# Pull requests only run `verify`. Publishing a public default Hosting URL from a
# branch is an external release, not a review artifact. The deploy job needs three
# explicit conditions: a federated identity, a project value, and a deliberate
# arming variable. A merge cannot publish merely because someone configured WIF.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "firebase.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "firebase.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Check trademark invariants
        working-directory: site
        run: npm run check:trademark

      - name: Check generated assets
        working-directory: site
        run: |
          node scripts/fonts.mjs --verify
          node scripts/favicons.mjs --verify

      - name: Typecheck
        working-directory: site
        run: npx astro check

      # No production origin here. A review build must stay visibly nonproduction
      # until an armed Firebase deploy builds the canonical public origin.
      - name: Build
        working-directory: site
        run: npm run build

      - name: Audit the self-contained snapshot
        working-directory: site
        run: npm run inline

      - name: Check the social card resolves in the build
        working-directory: site
        run: npm run check:social

      - name: Upload the reviewable snapshot
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gritchat-site-snapshot
          path: site/dist/gritchat-site.html
          if-no-files-found: error

  deploy:
    name: Publish to Firebase Hosting
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      vars.TF_WIF_PROVIDER != '' &&
      vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT != '' &&
      vars.GCP_PROJECT != '' &&
      vars.GRIT_HOSTING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # WIF-generated ADC is the Firebase CLI's documented CI authentication
      # path. `auth` creates GOOGLE_APPLICATION_CREDENTIALS for the rest of this
      # job; no long-lived credential crosses GitHub's secret boundary.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build for the canonical origin
        working-directory: site
        env:
          PUBLIC_SITE_ORIGIN: https://grit.chat
        run: npm run build

      - name: Audit the production artifact
        working-directory: site
        env:
          PUBLIC_SITE_ORIGIN: https://grit.chat
        run: |
          npm run inline
          npm run check:social

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1

      - name: Publish static files
        env:
          FIREBASE_PROJECT: ${{ vars.GCP_PROJECT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive

      # This proves the upload reached Firebase Hosting. It deliberately does
      # not claim grit.chat is live: CustomDomain ownership and certificates
      # cannot activate until GoDaddy delegates to the complete Cloud DNS zone.
      - name: Prove the default Hosting site serves this artifact
        env:
          FIREBASE_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/site.html -w '%{http_code}' "https://${FIREBASE_PROJECT}.web.app" || true)"
          test "$code" = "200"
          grep -q 'Grit Chat' /tmp/site.html
